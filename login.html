<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Boss Package Pro</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-top">
          <a href="index.html" class="brand brand-small">
            <span class="brand-mark">BP</span>
            <span>Boss Package Pro</span>
          </a>
          <h1>Welcome back</h1>
          <p>Sign in to access the admin dashboard.</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="admin@bosspackagepro.com" required />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary full-width">Login</button>
          <p class="form-status" id="loginStatus"></p>
        </form>

        <div class="auth-meta">
          <p>Demo admin: <strong>admin@bosspackagepro.com</strong> / <strong>admin123</strong></p>
          <a href="index.html">Back to homepage</a>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
